name: VeyraSettlement audited build artifact

on:
  push:
    branches:
      - arc-studio/settlement-mainnet-preview
    paths:
      - '.github/workflows/settlement-artifact.yml'
      - 'contracts/VeyraSettlement.sol'
      - 'foundry.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: Reproducible mainnet creation bytecode
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Install Foundry compiler
        uses: foundry-rs/foundry-toolchain@v1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install Solidity dependencies
        run: bun install --frozen-lockfile
      - name: Rebuild and verify source
        shell: bash
        run: |
          set -euo pipefail
          echo "Source SHA-256:"
          sha256sum contracts/VeyraSettlement.sol
          test "$(sha256sum contracts/VeyraSettlement.sol | cut -d' ' -f1)" = "5a6785953424a887bfc05a264237a1ed37076f15490a23a780b63fcbb317ad4b"
          forge build
          artifact=contracts/out/VeyraSettlement.sol/VeyraSettlement.json
          test -s "$artifact"
          bytecode=$(jq -r '.bytecode.object' "$artifact")
          echo "Creation bytecode bytes: $(((${#bytecode}-2)/2))"
          actual=$(cast keccak "$bytecode")
          echo "Creation bytecode Keccak: $actual"
          test "$actual" = "0xc70cdb0b5f3b9bdd698e44bfae66f6b76475b3a05686c950be33d7c444aad3d2"
          mkdir -p settlement-release
          cp "$artifact" settlement-release/VeyraSettlement.json
          printf '%s\n' "$actual" > settlement-release/bytecode.keccak
          sha256sum contracts/VeyraSettlement.sol > settlement-release/source.sha256
      - name: Publish verified creation bytecode to UI source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          artifact = json.loads(pathlib.Path('contracts/out/VeyraSettlement.sol/VeyraSettlement.json').read_text())
          creation = artifact['bytecode']['object']
          assert creation.startswith('0x') and len(creation) == 11994
          output = pathlib.Path('src/generated/veyraSettlementCreation.ts')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
            '/** Reproducibly compiled from contracts/VeyraSettlement.sol. '
            'Verified by GitHub Actions and cast keccak; do not edit manually. */\n'
            + 'export const VEYRA_SETTLEMENT_CREATION_BYTECODE = '
            + repr(creation).replace("'", '"') + ' as const;\n'
            + 'export const VEYRA_SETTLEMENT_CREATION_KECCAK = '
            + '"0xc70cdb0b5f3b9bdd698e44bfae66f6b76475b3a05686c950be33d7c444aad3d2" as const;\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/veyraSettlementCreation.ts
          git diff --cached --quiet || git commit -m "build(mainnet): publish verified Settlement creation bytecode"
          git push origin HEAD:refs/heads/arc-studio/settlement-mainnet-preview
      - name: Upload audited bytecode and ABI
        uses: actions/upload-artifact@v4
        with:
          name: veyra-settlement-mainnet-bytecode
          path: settlement-release/
          retention-days: 7
