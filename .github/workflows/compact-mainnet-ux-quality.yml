name: Veyra Mainnet Compact UX Quality

on:
  push:
    branches:
      - chatgpt/compact-ux-3stage-swap-horizontal
      - chatgpt/mainnet-fresh-receipt-recovery
  pull_request:
    branches:
      - feature/mainnet-identity-authority
    paths:
      - src/components/layout/AppShell.tsx
      - src/components/command/CommandBar.tsx
      - src/components/pages/MainnetHomePage.tsx
      - src/components/pages/MainnetActivityPage.tsx
      - src/components/pages/MainnetCirclePage.tsx
      - src/mainnet/recoveryTrust.ts
      - src/components/pages/MainnetExchangePage.tsx
      - src/components/ui/primitives.tsx
      - src/tests/**
      - e2e/mainnet-calm-ui-browser.mjs
      - studio/e2e/exchange-recovery.mjs
      - .github/workflows/compact-mainnet-ux-quality.yml

permissions:
  contents: read

concurrency:
  group: compact-mainnet-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, full Vitest and Mainnet build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Full Vitest
        run: bun run test
      - name: Build guarded Mainnet release artifact
        run: bun scripts/build-mainnet-pilot.ts
      - name: Check production bundle isolation
        run: bun run check:prod-bundle
  browser:
    name: Real Chromium 320px, 390px and desktop
    # Playwright 1.55 supports Ubuntu 24.04; ubuntu-latest currently resolves
    # to 26.04 where Chromium cannot be installed by this pinned runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build guarded Mainnet UI
        run: bun scripts/build-mainnet-pilot.ts
      - name: Install isolated Chromium
        run: |
          npm install --prefix /tmp/veyra-browser --no-save --no-audit --no-fund playwright@1.55.0
          node /tmp/veyra-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Start local Preview
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/veyra-ux-preview.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/veyra-ux-preview.log; exit 1; fi
      - name: Run disconnected-wallet browser regression
        env:
          VEYRA_PLAYWRIGHT_MODULE: file:///tmp/veyra-browser/node_modules/playwright/index.mjs
          VEYRA_BROWSER_URL: http://127.0.0.1:4173/
        run: node e2e/mainnet-calm-ui-browser.mjs
      - name: Start read-only Studio Preview for mock-wallet recovery
        run: |
          bash studio/dev.sh --host 127.0.0.1 --port 5173 --strictPort > /tmp/veyra-mock-recovery.log 2>&1 &
          ready=0
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/veyra-mock-recovery.log; exit 1; fi
      - name: Read-only mock-wallet Exchange recovery regression
        env:
          STUDIO_PREVIEW_URL: http://127.0.0.1:5173
        run: node studio/e2e/exchange-recovery.mjs
      - name: Save browser screenshots for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-mainnet-ux-chromium
          path: e2e-results
          if-no-files-found: ignore
          retention-days: 7
