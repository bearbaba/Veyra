name: Live Veyra Testnet Origin Smoke
on:
  push:
    branches:
      - test/veyra-canonical-origin-smoke-20261025
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Render BFF allows exact canonical Veyra Testnet Origin
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://veyra-unified-testnet.vercel.app'
          URL='https://veyra-testnet-acceptance-bff.onrender.com/api/identity/register/complete'
          http_code=$(curl --silent --show-error --retry 2 --retry-delay 4 --connect-timeout 15 --max-time 90 \
            --request POST --header "Origin: $ORIGIN" --header 'Content-Type: application/json' \
            --header 'Accept: application/json' --data '{}' --output /tmp/veyra_probe_body \
            --dump-header /tmp/veyra_probe_headers --write-out '%{http_code}' "$URL")
          echo "Backend unsigned preflight HTTP status: $http_code"
          if [ "$http_code" != "400" ]; then
            echo "Canonical Testnet origin is not accepted by the live backend (expected 400 INVALID_REQUEST)." >&2
            if [ "$http_code" = "403" ]; then
              echo "Likely Render ORIGIN_NOT_ALLOWED; cannot conduct signed wallet acceptance yet." >&2
            fi
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/veyra_probe_body') as f:
              result=json.load(f)
          assert result.get('error') == 'INVALID_REQUEST', "Unexpected backend auth response; cannot sign"
          with open('/tmp/veyra_probe_headers') as f:
              headers=f.read().lower()
          assert 'access-control-allow-origin: https://veyra-unified-testnet.vercel.app' in headers, "Exact browser CORS origin is missing"
          print('PASS: canonical Testnet Origin accepted, unsigned preflight returns 400 INVALID_REQUEST, exact CORS header present.')
          PY
      - name: Check public BFF health API without wallet signatures
        shell: bash
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error --connect-timeout 15 --max-time 45 \
            --header 'Accept: application/json' --output /tmp/veyra_health \
            --write-out '%{http_code}' https://veyra-testnet-acceptance-bff.onrender.com/api/health)
          echo "BFF health HTTP: $http_code"
          test "$http_code" = "200"
          python3 - <<'PY'
          import json
          with open('/tmp/veyra_health') as f:
              body=json.load(f)
          assert body.get('ok') is True, 'BFF health not ok'
          print('PASS: live backend health JSON confirms ok=true.')
          PY

      - name: Inspect canonical website availability and Vercel protection
        shell: bash
        run: |
          set -euo pipefail
          site='https://veyra-unified-testnet.vercel.app'
          status=$(curl --silent --show-error --location --max-time 40 --connect-timeout 15 \
            --header 'Cache-Control: no-cache' --output /tmp/veyra_site \
            --dump-header /tmp/veyra_site_headers --write-out '%{http_code}' "$site?smoke=20261025")
          echo "Canonical website GET status: $status"
          echo "Response content type: $(grep -i '^content-type:' /tmp/veyra_site_headers | tail -1 | tr -d '\r')"
          if [ "$status" != "200" ]; then
            echo 'FAIL: Veyra Testnet website did not return HTTP 200 without authentication.' >&2
            exit 1
          fi
          if ! grep -q '<div id="root"' /tmp/veyra_site; then
            echo 'FAIL: Veyra app HTML root not found; possible Vercel authentication page.' >&2
            exit 1
          fi
          echo 'PASS: public Testnet domain serves Veyra HTML root, no Vercel sign-in.'
          python3 - <<'PY'
          import re
          with open('/tmp/veyra_site',encoding='utf-8',errors='replace') as f:
              page=f.read()
          title=re.search(r'<title[^>]*>(.*?)</title>',page,re.I|re.S)
          print('Web page title:', ' '.join(title.group(1).split())[:100] if title else 'none')
          print('Veyra app HTML root:', '<div id="root"' in page)
          print('Vercel authentication markers:', any(x in page.lower() for x in ['vercel authentication','authentication required','vercel security checkpoint','log in to vercel']))
          PY
          if [ "$status" = '200' ]; then
            if grep -q '<div id="root"' /tmp/veyra_site || grep -q 'type="module"' /tmp/veyra_site; then
              echo 'PASS: canonical website HTML is accessible without additional login.'
            else
              echo 'WARN: 200 HTML returned but Veyra app root was not recognizable.'
            fi
          elif [ "$status" = '401' ] || [ "$status" = '403' ]; then
            echo 'PROTECTED: canonical website requires Vercel access. Authorized tester may need Vercel sign-in.'
          else
            echo 'BLOCKED: unexpected canonical website HTTP response.'
          fi
      - name: Check actual website-to-BFF identity route without user signature
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --max-time 45 --connect-timeout 15 \
            --request POST --header 'Origin: https://veyra-unified-testnet.vercel.app' \
            --header 'Content-Type: application/json' --header 'Accept: application/json' \
            --data '{}' --output /tmp/veyra_web_probe --dump-header /tmp/veyra_web_headers \
            --write-out '%{http_code}' \
            'https://veyra-unified-testnet.vercel.app/api/identity/register/complete')
          echo "Website proxied identity preflight HTTP status: $status"
          test "$status" = '400'
          python3 - <<'PY'
          import json
          with open('/tmp/veyra_web_probe') as f:
              body=json.load(f)
          assert body.get('error')=='INVALID_REQUEST',f"Unexpected Vercel-to-BFF preflight: {body.get('error')}"
          with open('/tmp/veyra_web_headers',encoding='utf-8') as f:
              h=f.read().lower()
          assert 'content-type: application/json' in h, 'Expected JSON from BFF, not Vercel login or HTML'
          print('PASS: website identity route is proxied to BFF; accepted canonical origin, no wallet signature.')
          PY

      - name: Verify live F5 session endpoints reject absent cookie and clear logout cookie
        shell: bash
        run: |
          set -euo pipefail
          site='https://veyra-unified-testnet.vercel.app'
          response=$(curl --silent --show-error --location --max-time 35 --connect-timeout 15 \
            --request POST --header "Origin: $site" \
            --header 'Content-Type: application/json' --header 'Accept: application/json' \
            --data '{"walletAddress":"0x1111111111111111111111111111111111111111"}' \
            --output /tmp/veyra_restore_body --write-out '%{http_code}' \
            "$site/api/auth/session/restore")
          echo "Public website restore without cookie HTTP status: $response"
          test "$response" = "401"
          python3 - <<'PY'
          import json
          with open('/tmp/veyra_restore_body') as f: data=json.load(f)
          assert data.get('error')=='SESSION_REAUTH_REQUIRED', 'Unexpected restore response or HTML fallback'
          print('PASS: missing cookie cannot restore a verified wallet session.')
          PY
          response=$(curl --silent --show-error --max-time 35 --connect-timeout 15 \
            --request POST --header "Origin: $site" --header 'Accept: application/json' \
            --output /tmp/veyra_logout_body --dump-header /tmp/veyra_logout_headers \
            --write-out '%{http_code}' "$site/api/auth/session/logout")
          echo "Public website logout HTTP status: $response"
          test "$response" = "200"
          python3 - <<'PY'
          import json
          with open('/tmp/veyra_logout_body') as f: data=json.load(f)
          assert data.get('ok') is True,'Invalid logout JSON'
          with open('/tmp/veyra_logout_headers') as f: h=f.read().lower()
          assert 'set-cookie: __secure-veyra-id-restore=' in h, 'Set-Cookie was stripped by Vercel rewrite'
          assert 'httponly' in h and 'secure' in h and 'samesite=strict' in h and 'max-age=0' in h, 'Missing cookie safety attributes'
          print('PASS: logout Set-Cookie safely forwarded through the canonical Vercel rewrite.')
          PY
