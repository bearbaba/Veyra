name: Mainnet Activity release checks

on:
  push:
    branches:
      - review/mainnet-activity-readonly-verification
      - fix/mainnet-p0-journal-cctp-link
      - feature/mainnet-human-first-ux
      - feature/mainnet-identity-authority
      - arc-studio/settlement-mainnet-preview
  pull_request:
    branches:
      - feature/mainnet-identity-authority
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainnet-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settlement_v2:
    name: Settlement V2 unsigned contract review
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Compile and adversarially test V2 without any deployment
        run: |
          forge build --contracts contracts/VeyraSettlementV2.sol
          forge test --match-contract VeyraSettlementV2Test -vv
      - name: Export reproducible reviewed V2 ABI and creation bytecode
        run: |
          mkdir -p settlement-v2-review
          cp contracts/out/VeyraSettlementV2.sol/VeyraSettlementV2.json settlement-v2-review/VeyraSettlementV2.json
          sha256sum contracts/VeyraSettlementV2.sol > settlement-v2-review/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-settlement-v2-unsigned-review
          path: settlement-v2-review/
          retention-days: 30
  web:
    name: Mainnet typecheck, lint, tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx oxlint --type-aware --quiet src scripts
      - name: Test Arc Mainnet financial flows and automatic Activity
        run: >
          bunx vitest run
          src/tests/mainnetAutomaticHistory.test.ts
          src/tests/mainnetP0Reliability.test.ts
          src/tests/mainnetP0ReleaseGuard.test.ts
          src/tests/mainnetUnifiedPayUx.test.ts
          src/tests/mainnetHumanFirstUx.test.ts
          src/tests/mainnetPeopleFlow.test.ts
          src/tests/mainnetIdentityAuthority.test.ts
          src/tests/mainnetDirectPayProof.test.ts
          src/tests/mainnetSettlementProof.test.ts
          src/tests/mainnetSettlementReceiptSync.test.ts
          src/tests/mainnetSettlementHistoricalBinding.test.ts
          src/tests/mainnetPilotMigrationGate.test.ts
          src/tests/mainnetPilotBootstrap.test.ts
          src/tests/mainnetSettlementMigrationPreflight.test.ts
          src/tests/mainnetV1JourneysUpgrade.test.ts
          src/tests/mainnetSettlementRestoreRehearsal.test.ts
          src/tests/mainnetSettlementIdentityUnification.test.ts
          src/tests/mainnetPaymentRequestsV1.test.ts
          src/tests/mainnetPaymentRequestRouting.test.ts
          src/tests/mainnetPaymentRequestRecoveryBehavior.test.ts
          src/tests/mainnetRequestResumeBehavior.test.ts
          src/tests/mainnetUnifiedFundingBounds.test.ts
          src/tests/mainnetReleaseCapabilities.test.ts
          src/tests/mainnetPayResumeIdentity.test.ts
          src/tests/mainnetPayFundingJourney.test.ts
          src/tests/mainnetServerPayJourney.test.ts
          src/tests/mainnetArcSharedUsdcFunding.test.ts
          src/tests/mainnetSettlementV2Candidate.test.ts
          src/tests/mainnetRecipientLookupBehavior.test.ts
          src/tests/mainnetWalletSigningLock.test.ts
          src/tests/mainnetPersistentReceipt.test.ts
          src/tests/mainnetReceiptRecovery.test.ts
          src/tests/mainnetBffIsolation.test.ts
          src/tests/mainnetIdentityOnlyMode.test.ts
          src/tests/mainnetPilotMigrationGate.test.ts
          src/tests/mainnetPilotBootstrap.test.ts
          src/tests/phase11BrowserRestoreSession.test.ts
          src/tests/phase9jTrustedWalletLoginOrigin.test.ts
          src/tests/phase9xIdentityOriginUx.test.ts
          src/tests/mainnetProductAndActivity.test.ts
          src/tests/phase6ArcMainnetPay.test.ts
          src/tests/settlementGasAndVerification.test.ts
          src/tests/phase3MainnetCatalog.test.ts
          src/tests/mainnetGatewayLostHashAutoDiscovery.test.ts
          src/tests/mainnetGateway12ChainAndBrandLogos.test.ts
          src/tests/gatewayMainnetBalances.test.ts
          src/tests/gatewayMultiSourceAllocation.test.ts
          src/tests/gatewayMainnetSecondOperation.test.ts
          src/tests/gatewayMainnetReconciliation.test.ts
          src/tests/mainnetUnifiedIntegrationUx.test.ts
          src/tests/mainnetCircle19NetworkDirectory.test.ts
          src/tests/mainnetCircleBridgeBatchVerification.test.ts
          src/tests/mainnetCircleMainnetCctpPolicy.test.ts
          src/tests/mainnetCctpSourceDiscovery.test.ts
          src/tests/arcAppKitBridge.test.ts
          src/tests/arcAppKitSwap.test.ts
      - name: Validate additive Settlement migration on disposable PostgreSQL 16
        run: |
          docker run -d --name veyra-mainnet-migration-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=CI_DUMMY_NOT_PRODUCTION \
            -e POSTGRES_DB=veyra_migration_ci postgres:16
          trap 'docker rm --force veyra-mainnet-migration-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec veyra-mainnet-migration-ci pg_isready -U postgres -d veyra_migration_ci >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || { echo 'ERROR: CI Postgres did not start'; exit 1; }
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE veyra_users(veyr_user_id text PRIMARY KEY);
          CREATE TABLE identity_snapshots(snapshot_id text PRIMARY KEY);
          CREATE TABLE mainnet_direct_pay_receipts(tx_hash text PRIMARY KEY,amount_raw text);
          INSERT INTO veyra_users(veyr_user_id) VALUES('usr_ci_sender'),('usr_ci_receiver');
          INSERT INTO mainnet_direct_pay_receipts VALUES ('legacy-original-hash','10000');
          SQL
          # The exact checked-in migration is applied twice to test its idempotence.
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 \
            < server/db/migrations/0021_mainnet_settlement_receipts.sql
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 \
            < server/db/migrations/0021_mainnet_settlement_receipts.sql
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO mainnet_settlement_receipts(
            tx_hash,chain_id,contract_address,payment_id,payment_ref,
            sender_address,recipient_address,sender_user_id,recipient_user_id,
            amount_raw,net_amount_raw,protocol_fee_raw,network_fee_wei,block_number,paid_at
          ) VALUES (
            '0x1111111111111111111111111111111111111111111111111111111111111111',
            5042,'0x4444444444444444444444444444444444444444',
            '0x2222222222222222222222222222222222222222222222222222222222222222',
            '0x3333333333333333333333333333333333333333333333333333333333333333',
            '0x5555555555555555555555555555555555555555',
            '0x6666666666666666666666666666666666666666',
            'usr_ci_sender','usr_ci_receiver','10000','9900','100','0',12,now()
          );
          DO $settlement_proof$
          BEGIN
            IF (SELECT count(*) FROM mainnet_settlement_receipts)<>1 THEN
              RAISE EXCEPTION 'Settlement migration failed to preserve canonical row';
            END IF;
            IF (SELECT count(*) FROM mainnet_direct_pay_receipts)<>1 THEN
              RAISE EXCEPTION 'Settlement migration modified legacy receipts';
            END IF;
            IF (SELECT count(*) FROM pg_indexes WHERE schemaname='public'
                AND indexname IN ('ix_mainnet_settlement_sender','ix_mainnet_settlement_recipient'))<>2 THEN
              RAISE EXCEPTION 'Missing settlement receipt owner indexes';
            END IF;
            -- Enforce the catalog names required by the production read-only preflight.
            -- If PostgreSQL 16 generates different names, fail CI before any release.
            IF (SELECT count(*) FROM pg_constraint
                WHERE conrelid='public.mainnet_settlement_receipts'::regclass
                AND conname IN (
                  'mainnet_settlement_receipts_pkey',
                  'mainnet_settlement_receipts_tx_hash_check',
                  'mainnet_settlement_receipts_chain_id_check',
                  'mainnet_settlement_receipts_payment_id_check',
                  'mainnet_settlement_receipts_payment_ref_check',
                  'mainnet_settlement_receipts_amount_raw_check',
                  'mainnet_settlement_receipts_net_amount_raw_check',
                  'mainnet_settlement_receipts_protocol_fee_raw_check',
                  'mainnet_settlement_receipts_network_fee_wei_check',
                  'mainnet_settlement_receipts_block_number_check',
                  'mainnet_settlement_receipts_sender_private_note_check',
                  'settlement_payer_or_receiver_bound',
                  'settlement_net_fee_matches_gross'
                ))<>13 THEN
              RAISE EXCEPTION 'Receipt SQL constraints do not match release preflight';
            END IF;
            BEGIN
              UPDATE mainnet_settlement_receipts SET net_amount_raw='9999';
              RAISE EXCEPTION 'Gross/net mismatch was wrongly accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE mainnet_settlement_receipts SET chain_id=8453;
              RAISE EXCEPTION 'Wrong chain was wrongly accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $settlement_proof$;
          SQL
          # Replay the ACTUAL Payment Request DDL twice against real PG16.
          # Prior CI ran only 0021, so a corrupted 0022 could pass unnoticed.
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 \
            < server/db/migrations/0022_veyra_payment_requests.sql
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 \
            < server/db/migrations/0022_veyra_payment_requests.sql
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO veyra_payment_requests(
            request_id,requester_user_id,payer_user_id,client_request_id,
            amount_raw,recipient_wallet,recipient_wallet_id,payment_ref,expires_at
          ) VALUES (
            'prq_123456789ABCDEFGHJK','usr_ci_receiver','usr_ci_sender',
            '11111111-1111-4111-8111-111111111111','10000',
            '0x6666666666666666666666666666666666666666','wallet-ci',
            '0x3333333333333333333333333333333333333333333333333333333333333333',
            now()+interval '7 days'
          );
          UPDATE veyra_payment_requests
          SET claim_id='22222222-2222-4222-8222-222222222222',
              claim_wallet='0x5555555555555555555555555555555555555555',
              claimed_at=now()
          WHERE request_id='prq_123456789ABCDEFGHJK' AND claim_id IS NULL;
          DO $request_claim$
          BEGIN
           IF (SELECT count(*) FROM veyra_payment_requests WHERE claim_id IS NOT NULL)<>1 THEN
            RAISE EXCEPTION 'Payment Request claim not persisted';
           END IF;
           IF (SELECT count(*) FROM pg_constraint WHERE
            conrelid='public.veyra_payment_requests'::regclass AND
            conname='payment_request_claim_complete')<>1 THEN
            RAISE EXCEPTION 'Payment Request claim completeness constraint missing';
           END IF;
           IF (SELECT count(*) FROM information_schema.columns WHERE
            table_schema='public' AND table_name='veyra_payment_requests'
            AND column_name IN ('claim_id','claim_wallet','claimed_at'))<>3 THEN
            RAISE EXCEPTION 'Payment Request attempt columns missing';
           END IF;
           BEGIN
            UPDATE veyra_payment_requests SET claim_wallet=NULL
            WHERE request_id='prq_123456789ABCDEFGHJK';
            RAISE EXCEPTION 'Broken claim wrongly accepted';
           EXCEPTION WHEN check_violation THEN NULL;
           END;
          END $request_claim$;
          SQL
          # A second attempt must not win an occupied server claim (CAS).
          count=$(docker exec veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -t -A -c \
            "WITH c AS (UPDATE veyra_payment_requests SET claim_id='33333333-3333-4333-8333-333333333333' WHERE request_id='prq_123456789ABCDEFGHJK' AND claim_id IS NULL RETURNING request_id) SELECT count(*) FROM c")
          [ "$count" = 0 ] || { echo 'ERROR: second claim won occupied request'; exit 1; }
          # Rehearse new cross-device journey DDL, including replay and race.
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 \
            < server/db/migrations/0023_mainnet_pay_journeys.sql
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 \
            < server/db/migrations/0023_mainnet_pay_journeys.sql
          docker exec -i veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO mainnet_pay_journeys(
           journey_id,owner_user_id,owner_wallet,payee_wallet,amount_raw,
           payment_ref,request_id,gateway_operation_id
          ) VALUES (
           '11111111-1111-4111-8111-111111111111',
           'usr_ci_sender','0x5555555555555555555555555555555555555555',
           '0x6666666666666666666666666666666666666666','10000',
           '0x3333333333333333333333333333333333333333333333333333333333333333',
           'prq_123456789ABCDEFGHJK','44444444-4444-4444-8444-444444444444'
          );
          DO $check_journey$
          BEGIN
           IF (SELECT count(*) FROM information_schema.columns WHERE table_schema='public'
             AND table_name='mainnet_pay_journeys' AND column_name IN
             ('journey_id','owner_user_id','owner_wallet','payee_wallet','amount_raw',
              'payment_ref','request_id','gateway_operation_id','verified_tx_hash'))<>9 THEN
            RAISE EXCEPTION 'Missing cross-device journal columns';
           END IF;
           BEGIN
            INSERT INTO mainnet_pay_journeys(
             journey_id,owner_user_id,owner_wallet,payee_wallet,amount_raw,payment_ref,gateway_operation_id
            ) VALUES('22222222-2222-4222-8222-222222222222','usr_ci_sender',
              '0x5555555555555555555555555555555555555555',
              '0x6666666666666666666666666666666666666666','10001',
              '0x7777777777777777777777777777777777777777777777777777777777777777',
              '55555555-5555-4555-8555-555555555555');
            RAISE EXCEPTION 'Second device bypassed unresolved owner journal';
           EXCEPTION WHEN unique_violation THEN NULL;
           END;
           BEGIN
            UPDATE mainnet_pay_journeys SET verified_tx_hash=
             '0x8888888888888888888888888888888888888888888888888888888888888888';
            RAISE EXCEPTION 'Incomplete client completion was accepted';
           EXCEPTION WHEN check_violation THEN NULL;
           END;
           BEGIN
            UPDATE mainnet_pay_journeys
             SET verified_at=now(),verified_tx_hash=
             '0x8888888888888888888888888888888888888888888888888888888888888888';
            RAISE EXCEPTION 'Unverified client-style completion was accepted';
           EXCEPTION WHEN foreign_key_violation THEN NULL;
           END;
          END $check_journey$;
          SQL
          # Reference constraints are derived by PostgreSQL 16 itself from
          # the exact checked-in SQL. This prevents lossy handwritten parsing.
          docker exec veyra-mainnet-migration-ci psql -U postgres -d veyra_migration_ci -A -t -c \
            "SELECT json_agg(json_build_object('name',conname,'type',contype::text,'definition',pg_get_constraintdef(oid)) ORDER BY conname)::text FROM pg_constraint WHERE conrelid='public.mainnet_settlement_receipts'::regclass AND contype IN ('c','p')" \
            | bun scripts/check-settlement-pg16-reference.ts

      # This tests the ACTUAL Render container. Web builds alone miss runtime
      # imports such as the pinned contract ABI (Docker context allowlist).
      - name: Build isolated read-only Mainnet BFF container
        run: docker build -f Dockerfile.bff.mainnet -t veyra-mainnet-bff:ci .

      - name: Boot Mainnet BFF with dummy credentials and reject anonymous receipt access
        run: |
          docker run --detach --name veyra-mainnet-bff-ci --network host \
            -e VEYRA_APP_ORIGIN=https://veyra-seven-beta.vercel.app \
            -e VEYRA_SESSION_SECRET=CI_DUMMY_ONLY_012345678901234567890123456789 \
            -e DATABASE_URL=postgresql://ci:ci@db.invalid:5432/veyra_mainnet_v1_db?sslmode=require \
            -e ARC_MAINNET_RPC_URL=https://arc-rpc.invalid \
            veyra-mainnet-bff:ci
          trap 'docker rm --force veyra-mainnet-bff-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /tmp/veyra-mainnet-ci-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs veyra-mainnet-bff-ci
            exit 1
          fi
          grep -q '"ok":true' /tmp/veyra-mainnet-ci-health.json
          for route in /api/mainnet/settlement/receipts /api/mainnet/pay/receipts; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Origin: https://veyra-seven-beta.vercel.app' \
              "http://127.0.0.1:3001$route")
            if [ "$code" != 401 ]; then
              echo "ERROR: unauthenticated receipt listing was not blocked ($code) on $route"
              exit 1
            fi
          done
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header 'Origin: https://veyra-seven-beta.vercel.app' \
            --data '{"hash":"0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' \
            http://127.0.0.1:3001/api/mainnet/settlement/receipt/verify)
          if [ "$code" != 401 ]; then
            echo "ERROR: anonymous contract receipt indexing was not blocked ($code)"
            exit 1
          fi
          echo 'Isolated Mainnet BFF runtime + unauthenticated financial receipt gates: PASS'

      - name: Build exact full Mainnet release profile (matches vercel.json)
        run: bun scripts/build-mainnet-pilot.ts
      - run: bun run check:prod-bundle
      - name: Read-only live Mainnet BFF health and identity schema smoke
        run: bun scripts/smoke-mainnet-bff.ts

  browser_ui:
    name: Real Chromium desktop/mobile unsigned UI
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-mainnet-pilot.ts
      - name: Install isolated Playwright QA runner and Chromium
        run: |
          mkdir -p /tmp/veyra-browser-runner
          npm --prefix /tmp/veyra-browser-runner install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          ln -s /tmp/veyra-browser-runner/node_modules/playwright ./node_modules/playwright
          /tmp/veyra-browser-runner/node_modules/.bin/playwright install --with-deps chromium
      - name: Navigate actual Mainnet UI in a real browser (no wallets or transfers)
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/veyra-qa-vite.log 2>&1 &
          for i in $(seq 1 35); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          VEYRA_QA_URL=http://127.0.0.1:4173 node qa/mainnet-browser-qa.mjs
      - name: Upload browser measurements, viewport screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-mainnet-browser-qa
          path: /tmp/veyra-browser-qa/
          retention-days: 14
