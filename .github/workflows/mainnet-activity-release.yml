name: Mainnet Activity release checks

on:
  push:
    branches:
      - review/mainnet-activity-readonly-verification
      - fix/mainnet-p0-journal-cctp-link
      - feature/mainnet-human-first-ux
      - feature/mainnet-identity-authority
      - arc-studio/settlement-mainnet-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainnet-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Mainnet typecheck, lint, tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx oxlint --type-aware --quiet src scripts
      - name: Test Arc Mainnet financial flows and automatic Activity
        run: >
          bunx vitest run
          src/tests/mainnetAutomaticHistory.test.ts
          src/tests/mainnetP0Reliability.test.ts
          src/tests/mainnetP0ReleaseGuard.test.ts
          src/tests/mainnetUnifiedPayUx.test.ts
          src/tests/mainnetHumanFirstUx.test.ts
          src/tests/mainnetPeopleFlow.test.ts
          src/tests/mainnetIdentityAuthority.test.ts
          src/tests/mainnetDirectPayProof.test.ts
          src/tests/mainnetPersistentReceipt.test.ts
          src/tests/mainnetReceiptRecovery.test.ts
          src/tests/mainnetBffIsolation.test.ts
          src/tests/mainnetIdentityOnlyMode.test.ts
          src/tests/mainnetPilotMigrationGate.test.ts
          src/tests/mainnetPilotBootstrap.test.ts
          src/tests/phase11BrowserRestoreSession.test.ts
          src/tests/phase9jTrustedWalletLoginOrigin.test.ts
          src/tests/phase9xIdentityOriginUx.test.ts
          src/tests/mainnetProductAndActivity.test.ts
          src/tests/phase6ArcMainnetPay.test.ts
          src/tests/settlementGasAndVerification.test.ts
          src/tests/phase3MainnetCatalog.test.ts
          src/tests/arcAppKitBridge.test.ts
          src/tests/arcAppKitSwap.test.ts
      - name: Build exact full Mainnet release profile (matches vercel.json)
        run: bun scripts/build-mainnet-pilot.ts
      - run: bun run check:prod-bundle
