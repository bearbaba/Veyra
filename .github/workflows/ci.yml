name: CI

on:
  push:
    branches:
      - develop
      - 'phase*'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: DEV source isolation
        run: bun run check:dev-isolation

      - name: Lint
        run: |
          bunx oxlint --type-aware --quiet src scripts
          bunx oxlint --quiet .

      - name: Test
        run: bun run test -- --run

      - name: Build
        run: bun run build

      - name: Production bundle isolation
        run: bun run check:prod-bundle

      - name: Static Vercel UI-only preview build
        run: VITE_VEYRA_ENV=testnet VITE_VEYRA_UI_ONLY=1 bun run build

      - name: Static Vercel preview bundle isolation
        run: bun run check:prod-bundle

      - name: Assert no wallet signing and BFF code in preview JavaScript
        run: bun run check:vercel-preview-bundle
